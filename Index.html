<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Under Maintenance</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background-color: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
              max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }

  .container {
    text-align: center;
    max-width: 32rem;
    width: 100%;
  }

  .emoji {
    font-size: clamp(24px, 5vw, 32px);
    margin-bottom: clamp(18px, 4vw, 28px);
    line-height: 1;
  }

  h1 {
    font-size: clamp(26px, 6vw, 42px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: clamp(10px, 2vw, 14px);
  }

  p {
    font-size: clamp(14px, 2.2vw, 17px);
    font-weight: 400;
    color: #6b6b6b;
    line-height: 1.55;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="emoji">🚧</div>
    <h1>Under maintenance</h1>
    <p>We're making a few improvements. Please check back soon.</p>
  </div>
</body>
</html>
