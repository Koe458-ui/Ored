<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>oredlab connection check</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;padding:16px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       background:#111;color:#eee}
  h1{font:600 16px/1.4 system-ui,sans-serif;margin:0 0 4px}
  p.sub{font:13px/1.4 system-ui,sans-serif;color:#9aa;margin:0 0 16px}
  .row{border:1px solid #333;border-radius:8px;padding:10px 12px;margin:0 0 10px;background:#181818}
  .name{font:600 13px/1.4 system-ui,sans-serif;color:#cfd;margin-bottom:4px}
  .val{white-space:pre-wrap;word-break:break-word;color:#ddd}
  .ok{color:#5c6}.bad{color:#f77}.warn{color:#fc6}
  button{font:600 14px/1 system-ui,sans-serif;padding:12px 16px;border-radius:8px;
         border:1px solid #444;background:#222;color:#eee;margin:4px 6px 12px 0}
</style>
</head>
<body>
<h1>oredlab connection check</h1>
<p class="sub">Open this in the browser that is failing. Screenshot the whole page.</p>
<button id="copy">Copy result as text</button>
<button id="rerun">Run again</button>
<div id="out"></div>
<script>
(function(){
  var out = document.getElementById('out');
  var lines = [];
  function add(name, value, cls){
    lines.push(name + ': ' + value);
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<div class="name"></div><div class="val ' + (cls||'') + '"></div>';
    d.querySelector('.name').textContent = name;
    d.querySelector('.val').textContent = value;
    out.appendChild(d);
  }
  function run(){
    out.innerHTML = ''; lines = [];
    add('when', new Date().toISOString());
    add('url', location.href);
    add('userAgent', navigator.userAgent);
    add('online', String(navigator.onLine), navigator.onLine ? 'ok' : 'bad');
    try{
      var c = navigator.connection;
      add('connection', c ? (c.effectiveType + ', saveData=' + c.saveData) : 'not exposed');
    }catch(e){ add('connection', 'threw: ' + e.message); }

    try{
      add('cookies enabled', String(navigator.cookieEnabled), navigator.cookieEnabled ? 'ok' : 'warn');
    }catch(e){}
    try{ localStorage.setItem('dzdiag','1'); localStorage.removeItem('dzdiag');
      add('localStorage', 'works', 'ok');
    }catch(e){ add('localStorage', 'BLOCKED: ' + e.message, 'bad'); }
    try{
      var r = indexedDB.open('dzdiag');
      r.onsuccess = function(){ try{ r.result.close(); }catch(e){} };
      add('indexedDB', 'open() did not throw', 'ok');
    }catch(e){ add('indexedDB', 'BLOCKED: ' + e.message, 'bad'); }

    if ('serviceWorker' in navigator) {
      var ctl = navigator.serviceWorker.controller;
      add('service worker controlling', ctl ? ctl.scriptURL : 'none', ctl ? 'ok' : 'warn');
      navigator.serviceWorker.getRegistrations().then(function(rs){
        add('sw registrations', rs.length ? rs.map(function(x){ return x.scope; }).join(', ') : 'none');
      }).catch(function(e){ add('sw registrations', 'threw: ' + e.message, 'bad'); });
    } else { add('service worker', 'unsupported', 'warn'); }

    if (window.caches) {
      caches.keys().then(function(k){ add('cache storage', k.length ? k.join(', ') : 'empty'); })
        .catch(function(e){ add('cache storage', 'threw: ' + e.message, 'bad'); });
    }

    var t0 = Date.now();
    fetch('/config.js', { cache: 'reload' }).then(function(res){
      add('GET /config.js', res.status + ' ' + res.statusText + '  (' + (Date.now()-t0) + 'ms)',
          res.ok ? 'ok' : 'bad');
      return res.text();
    }).then(function(txt){
      var url = (/SB_URL\s*:\s*'([^']+)'/.exec(txt) || [])[1] || '';
      var key = (/SB_KEY\s*:\s*'([^']+)'/.exec(txt) || [])[1] || '';
      add('config SB_URL', url || 'NOT FOUND', url ? 'ok' : 'bad');
      add('config SB_KEY', key ? (key.slice(0, 18) + '… (' + key.length + ' chars)') : 'NOT FOUND',
          key ? 'ok' : 'bad');
      if (!url || !key) return;
      var q = url.replace(/\/$/, '') +
        '/rest/v1/artworks?select=id&status=eq.approved&visibility=eq.published&kind=eq.art&limit=1';
      var t1 = Date.now();
      return fetch(q, { headers: { apikey: key, Authorization: 'Bearer ' + key } })
        .then(function(res){
          add('GET artworks', res.status + ' ' + res.statusText + '  (' + (Date.now()-t1) + 'ms)',
              res.ok ? 'ok' : 'bad');
          return res.text().then(function(b){
            add('artworks body', b.slice(0, 300) || '(empty)', res.ok ? 'ok' : 'bad');
          });
        })
        .catch(function(e){
          add('GET artworks', 'REQUEST FAILED: ' + e.name + ' — ' + e.message, 'bad');
          add('meaning', 'the request never completed: blocked by an extension, DNS, or the network', 'bad');
        });
    }).catch(function(e){
      add('GET /config.js', 'REQUEST FAILED: ' + e.name + ' — ' + e.message, 'bad');
    });

    fetch('/', { cache: 'reload' }).then(function(res){ return res.text(); }).then(function(html){
      var vs = [];
      ['app-core','gallery','feed','startup','secview'].forEach(function(n){
        var m = new RegExp('/js/' + n + '\\.js\\?v=(\\d+)').exec(html);
        if (m) vs.push(n + '=' + m[1]);
      });
      add('index.html script versions', vs.join('  ') || 'none found');
    }).catch(function(e){ add('index.html', 'fetch failed: ' + e.message, 'bad'); });
  }
  document.getElementById('rerun').onclick = run;
  document.getElementById('copy').onclick = function(){
    var t = lines.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ alert('Copied'); },
      function(){ prompt('Copy this:', t); });
    else prompt('Copy this:', t);
  };
  run();
})();
</script>
</body>
</html>
