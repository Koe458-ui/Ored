run_name: char_transformer
task: language_model
seed: 1337
deterministic: true

data:
  source: generated
  tokenizer: char
  block_size: 512
  stride: 256
  batch_size: 32
  shuffle_train: true
  corpus:
    dir: data/raw/corpus
    sentence_lines: 60000
    max_operand: 30
    arithmetic_repeats: 10
    pair_split:
      train: 0.70
      val: 0.15
      test: 0.15
    val_test_fraction: 0.15
  supabase:
    dataset_tag: ""
    types: []
    categories: []
    subjects: []
    languages: []
    include_unverified: false
    split_seed: 1337
    snapshot: ""
    snapshot_dir: data/snapshots
    on_invalid: fail
    notes: ""

model:
  name: transformer
  d_model: 256
  n_layer: 6
  n_head: 8
  d_ff: 1024
  dropout: 0.1
  tie_weights: true

training:
  epochs: 60
  learning_rate: 0.0005
  optimizer: adamw
  weight_decay: 0.01
  loss: cross_entropy
  scheduler: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1
  grad_clip: 1.0
  early_stopping_patience: 8
  log_every: 1
  device: auto
  resume: ""

generation:
  max_new_tokens: 400
  temperature: 0.8
  top_k: 0
  top_p: 0.0
  prompt: ""

paths:
  checkpoint_dir: checkpoints
