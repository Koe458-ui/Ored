name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: No keys, tokens or secret files in the repository
        run: python3 .github/scripts/check_secrets.py
