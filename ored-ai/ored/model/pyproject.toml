[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ored"
version = "0.1.0"
description = "Ored.ai -- an AI built from scratch, no pretrained weights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2,<3.0",
    "numpy>=1.24,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ored-generate-dataset = "ored.data.generate:main"
ored-generate-corpus = "ored.data.corpus:main"
ored-train = "ored.training.trainer:main"
ored-evaluate = "ored.evaluation.evaluator:main"
ored-infer = "ored.inference.predictor:main"
ored-generate = "ored.inference.generate_cli:main"
ored-export-learning = "ored.learning.export_cli:main"
ored-checkpoints = "ored.learning.checkpoint_cli:main"
ored-serve = "ored.serving.server:main"
ored-distributed = "ored.distributed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
