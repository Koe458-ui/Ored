  - id: "00051"
    category: biology
    question: "What is a cell?"
    answer: "A cell is the basic structural and functional unit of living organisms."

  - id: "00052"
    category: biology
    question: "What is DNA?"
    answer: "DNA is a molecule that stores hereditary information."

  - id: "00053"
    category: biology
    question: "What is RNA?"
    answer: "RNA is a nucleic acid involved in information transfer and gene expression."

  - id: "00054"
    category: biology
    question: "What is a gene?"
    answer: "A gene is a region of genetic material associated with a functional product or regulatory role."

  - id: "00055"
    category: biology
    question: "What is a chromosome?"
    answer: "A chromosome is a DNA-protein structure that carries genetic information."

  - id: "00056"
    category: biology
    question: "What is a ribosome?"
    answer: "A ribosome is a cellular structure that assembles proteins."

  - id: "00057"
    category: biology
    question: "What is a mitochondrion?"
    answer: "A mitochondrion is an organelle involved in cellular energy metabolism."

  - id: "00058"
    category: biology
    question: "What is a chloroplast?"
    answer: "A chloroplast is an organelle where photosynthesis occurs in plants and algae."

  - id: "00059"
    category: biology
    question: "What is the nucleus?"
    answer: "The nucleus is a membrane-bound organelle containing most eukaryotic genomic DNA."

  - id: "00060"
    category: biology
    question: "What is an enzyme?"
    answer: "An enzyme is a biological catalyst."

  - id: "00061"
    category: biology
    question: "What is a protein?"
    answer: "A protein is a biological polymer made from amino acids."

  - id: "00062"
    category: biology
    question: "What is photosynthesis?"
    answer: "Photosynthesis converts light energy into chemical energy."

  - id: "00063"
    category: biology
    question: "What is cellular respiration?"
    answer: "Cellular respiration is a set of reactions that releases usable energy from organic molecules."

  - id: "00064"
    category: biology
    question: "What is mitosis?"
    answer: "Mitosis is nuclear division that generally produces genetically similar daughter nuclei."

  - id: "00065"
    category: biology
    question: "What is meiosis?"
    answer: "Meiosis is specialized cell division that produces haploid cells."

  - id: "00066"
    category: biology
    question: "What is homeostasis?"
    answer: "Homeostasis is maintenance of relatively stable internal conditions."

  - id: "00067"
    category: biology
    question: "What is evolution?"
    answer: "Evolution is change in inherited characteristics of populations across generations."

  - id: "00068"
    category: biology
    question: "What is natural selection?"
    answer: "Natural selection is differential survival and reproduction associated with heritable variation."

  - id: "00069"
    category: biology
    question: "What is an ecosystem?"
    answer: "An ecosystem consists of organisms and their physical environment."

  - id: "00070"
    category: biology
    question: "What is a population in biology?"
    answer: "A population is a group of individuals of the same species living in an area."

  - id: "00071"
    category: computing
    question: "What is a CPU?"
    answer: "A CPU is the central processing unit that executes program instructions."

  - id: "00072"
    category: computing
    question: "What is a GPU?"
    answer: "A GPU is a processor designed for highly parallel computation and graphics workloads."

  - id: "00073"
    category: computing
    question: "What is RAM?"
    answer: "RAM is volatile memory used for active data and programs."

  - id: "00074"
    category: computing
    question: "What is ROM?"
    answer: "ROM is non-volatile memory used for persistent data in various forms."

  - id: "00075"
    category: computing
    question: "What is cache memory?"
    answer: "Cache is small, fast memory that stores frequently or recently used data."

  - id: "00076"
    category: computing
    question: "What is an algorithm?"
    answer: "An algorithm is a defined procedure for solving a problem or performing a computation."

  - id: "00077"
    category: computing
    question: "What is a compiler?"
    answer: "A compiler translates source code into another form, often machine or intermediate code."

  - id: "00078"
    category: computing
    question: "What is an interpreter?"
    answer: "An interpreter processes or executes source code through interpretation."

  - id: "00079"
    category: computing
    question: "What is an operating system?"
    answer: "An operating system manages hardware resources and provides services to applications."

  - id: "00080"
    category: computing
    question: "What is a process?"
    answer: "A process is a running instance of a program with associated execution state and resources."

  - id: "00081"
    category: computing
    question: "What is a thread?"
    answer: "A thread is a sequence of execution within a process."

  - id: "00082"
    category: computing
    question: "What is a database?"
    answer: "A database is an organized collection of data managed for storage and retrieval."

  - id: "00083"
    category: computing
    question: "What is SQL?"
    answer: "SQL is a language used to define, query, and manipulate relational data."

  - id: "00084"
    category: computing
    question: "What is HTTP?"
    answer: "HTTP is an application-layer protocol used for transferring web resources."

  - id: "00085"
    category: computing
    question: "What is HTTPS?"
    answer: "HTTPS is HTTP carried over an encrypted TLS connection."

  - id: "00086"
    category: computing
    question: "What is DNS?"
    answer: "DNS is a naming system that maps domain names to network information."

  - id: "00087"
    category: computing
    question: "What is an API?"
    answer: "An API is a defined interface through which software components communicate."

  - id: "00088"
    category: computing
    question: "What is encryption?"
    answer: "Encryption transforms data so it cannot be read without the required key."

  - id: "00089"
    category: computing
    question: "What is a hash function?"
    answer: "A hash function maps input data to a fixed-size output."

  - id: "00090"
    category: computing
    question: "What is binary?"
    answer: "Binary is a number system using two symbols, conventionally 0 and 1."

