facts:
  - id: "00001"
    category: physics
    question: "What is velocity?"
    answer: "Velocity is speed together with a specified direction."

  - id: "00002"
    category: physics
    question: "What is acceleration?"
    answer: "Acceleration is the rate of change of velocity with time."

  - id: "00003"
    category: physics
    question: "What is force?"
    answer: "Force is an interaction that can change the motion of an object."

  - id: "00004"
    category: physics
    question: "What is momentum?"
    answer: "Momentum is the product of mass and velocity."

  - id: "00005"
    category: physics
    question: "What is kinetic energy?"
    answer: "Kinetic energy is the energy associated with motion."

  - id: "00006"
    category: physics
    question: "What is potential energy?"
    answer: "Potential energy is energy associated with position or configuration."

  - id: "00007"
    category: physics
    question: "What is power?"
    answer: "Power is the rate of energy transfer or work done."

  - id: "00008"
    category: physics
    question: "What is density?"
    answer: "Density is mass per unit volume."

  - id: "00009"
    category: physics
    question: "What is pressure?"
    answer: "Pressure is force distributed over an area."

  - id: "00010"
    category: physics
    question: "What is frequency?"
    answer: "Frequency is the number of cycles occurring per unit time."

  - id: "00011"
    category: physics
    question: "What is wavelength?"
    answer: "Wavelength is the distance between corresponding points of successive waves."

  - id: "00012"
    category: physics
    question: "What is a period in physics?"
    answer: "A period is the time required for one complete cycle."

  - id: "00013"
    category: physics
    question: "What is electric charge?"
    answer: "Electric charge is a physical property responsible for electrical interactions."

  - id: "00014"
    category: physics
    question: "What is electric current?"
    answer: "Electric current is the rate of flow of electric charge."

  - id: "00015"
    category: physics
    question: "What is voltage?"
    answer: "Voltage is electric potential difference between two points."

  - id: "00016"
    category: physics
    question: "What is electrical resistance?"
    answer: "Electrical resistance is opposition to the flow of electric current."

  - id: "00017"
    category: physics
    question: "What is capacitance?"
    answer: "Capacitance is the ability of a system to store electric charge per unit voltage."

  - id: "00018"
    category: physics
    question: "What is inductance?"
    answer: "Inductance is a property of a circuit that opposes changes in current through induced voltage."

  - id: "00019"
    category: physics
    question: "What is torque?"
    answer: "Torque is the turning effect of a force about an axis or point."

  - id: "00020"
    category: physics
    question: "What is impulse?"
    answer: "Impulse is the change in momentum produced by a force acting over time."

  - id: "00021"
    category: chemistry
    question: "What is an atom?"
    answer: "An atom is the smallest unit of an element that retains its chemical identity."

  - id: "00022"
    category: chemistry
    question: "What is a proton?"
    answer: "A proton is a positively charged particle found in an atomic nucleus."

  - id: "00023"
    category: chemistry
    question: "What is a neutron?"
    answer: "A neutron is an electrically neutral particle found in an atomic nucleus."

  - id: "00024"
    category: chemistry
    question: "What is an electron?"
    answer: "An electron is a negatively charged particle associated with an atom."

  - id: "00025"
    category: chemistry
    question: "What is an element?"
    answer: "An element is a substance whose atoms have the same number of protons."

  - id: "00026"
    category: chemistry
    question: "What is a molecule?"
    answer: "A molecule is a group of atoms held together by chemical bonds."

  - id: "00027"
    category: chemistry
    question: "What is a compound?"
    answer: "A compound contains atoms of different elements chemically combined."

  - id: "00028"
    category: chemistry
    question: "What is pH?"
    answer: "pH is a logarithmic measure related to hydrogen-ion concentration."

  - id: "00029"
    category: chemistry
    question: "What is oxidation?"
    answer: "Oxidation is commonly described as loss of electrons."

  - id: "00030"
    category: chemistry
    question: "What is a catalyst?"
    answer: "A catalyst changes the rate of a chemical reaction without being consumed overall."

